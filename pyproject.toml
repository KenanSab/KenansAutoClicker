[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kenansautoclicker"
version = "2.1.1"
description = "Input automation for accessibility, repetitive work and software testing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kenan" }]
keywords = [
    "autoclicker", "automation", "accessibility", "assistive-technology",
    "macro", "testing", "input", "productivity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Adaptive Technologies",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = ["pynput>=1.7.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/KenanSab/KenansAutoClicker"
Source = "https://github.com/KenanSab/KenansAutoClicker"
Issues = "https://github.com/KenanSab/KenansAutoClicker/issues"
Releases = "https://github.com/KenanSab/KenansAutoClicker/releases"

# Installing the package puts a `kenansautoclicker` command on PATH.
[project.scripts]
kenansautoclicker = "kenansautoclicker.app:main"

[tool.setuptools]
packages = ["kenansautoclicker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
