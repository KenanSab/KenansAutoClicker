name: Build Kenan's AutoClicker

# Tests, builds and publishes automatically.
#
#   push to main   ->  run tests, build Windows + macOS, and refresh the
#                      rolling "latest" release so there is always a working
#                      download without having to tag anything
#   push a v* tag  ->  the same, plus a permanent versioned release
#
# Nothing is built unless the test suite passes first.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

permissions:
  contents: write       # needed to create Releases

jobs:
  # ----------------------------------------------------------------- #
  #  TESTS  ->  must pass before anything is built
  # ----------------------------------------------------------------- #
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          pip install pynput pytest

      - name: Run tests
        run: xvfb-run -a python -m pytest tests/ -q

  # ----------------------------------------------------------------- #
  #  WINDOWS  ->  KenansAutoClicker.exe
  # ----------------------------------------------------------------- #
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pynput pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --icon docs/icon.ico --name "KenansAutoClicker" KenansAutoClicker.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KenansAutoClicker-Windows
          path: dist/KenansAutoClicker.exe

  # ----------------------------------------------------------------- #
  #  macOS  ->  KenansAutoClicker (app bundle, zipped)
  # ----------------------------------------------------------------- #
  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pynput pyinstaller

      - name: Build app
        run: pyinstaller --onefile --windowed --icon docs/icon.icns --name "KenansAutoClicker" KenansAutoClicker.py

      - name: Zip the .app
        run: |
          cd dist
          zip -r KenansAutoClicker-macOS.zip KenansAutoClicker.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KenansAutoClicker-macOS
          path: dist/KenansAutoClicker-macOS.zip

  # ----------------------------------------------------------------- #
  #  RELEASE  ->  publishes the builds so people can actually download them
  # ----------------------------------------------------------------- #
  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect them into one folder
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' \) -exec cp {} out/ \;
          ls -lh out

      - name: Read the version
        id: ver
        run: |
          V=$(grep -oP '(?<=__version__ = ")[^"]+' kenansautoclicker/__init__.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version is $V"

      # --- every push to main: refresh a rolling pre-release ---------------
      - name: Update the rolling "latest" release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Development build (v${{ steps.ver.outputs.version }})"
          prerelease: true
          body: |
            Rolling build from the newest commit on `main`. For a stable
            download, use the latest **tagged release** instead.

            **Version:** `v${{ steps.ver.outputs.version }}`
            **Commit:** ${{ github.sha }}

            | Platform | File |
            |---|---|
            | Windows | `KenansAutoClicker.exe` |
            | macOS | `KenansAutoClicker-macOS.zip` |

            Windows will warn that the app is unsigned — click
            **More info → Run anyway**. On macOS, right-click → **Open** the
            first time, then allow it under Privacy & Security → Accessibility.

            For a stable version, see the tagged releases below.
          files: out/*

      # --- a v* tag: publish a permanent versioned release -----------------
      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true          # this is the one people should download
          files: out/*
